// ===== PEMUTAR =====
let AC=null,buf=null,src=null,playing=false,t0=0,c0=0,cur=0,sfxG=null;
const $=id=>document.getElementById(id),inf=$('inf'),rg=$('rg');
const now=()=>playing?Math.min(END,t0+AC.currentTime-c0):cur;
function play(){if(playing)return;AC=AC||new AudioContext();AC.resume();if(cur>=END-.01)cur=0;t0=cur;c0=AC.currentTime;playing=true;
 if(buf){src=AC.createBufferSource();src.buffer=buf;src.connect(AC.destination);const p=t0-AUDIO_OFFSET;if(p>=0)src.start(0,p);else src.start(AC.currentTime-p)}
 sfxG=AC.createGain();sfxG.gain.value=$('sx').checked?.5:0;sfxG.connect(AC.destination);schedSfx(AC,sfxG,t0,c0)}
function pause(){if(!playing)return;cur=now();playing=false;try{src&&src.stop()}catch(e){}if(sfxG)sfxG.disconnect()}
$('bp').onclick=play;$('bj').onclick=pause;$('sx').onchange=()=>{if(sfxG)sfxG.gain.value=$('sx').checked?.5:0};
rg.oninput=()=>{const v=rg.value/1000*END,was=playing;pause();cur=v;if(was)play();window.__t=v;window.renderFrame(v)};
$('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;AC=AC||new AudioContext();const fr=new FileReader();fr.onload=()=>AC.decodeAudioData(fr.result,b=>{buf=b;inf.textContent='Audio '+b.duration.toFixed(1)+' dtk | animasi '+END.toFixed(1)+' dtk'},()=>inf.textContent='Audio gagal dibaca');fr.readAsArrayBuffer(f)};
inf.textContent='Animasi '+END.toFixed(1)+' dtk';
addEventListener('resize',layout);
if(RM){$('ct').style.display='none'}
window.__t=0;layout();window.renderFrame(0);
if(!RM){(function loop(){const t=now();window.__t=t;window.renderFrame(t);rg.value=t/END*1000;if(playing&&t>=END)pause();requestAnimationFrame(loop)})()}
